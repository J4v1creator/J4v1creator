<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="142" viewBox="0 0 1000 142" role="img" aria-label="GitHub Activity &amp; Metrics" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
  <title>GitHub Activity &amp; Metrics</title>
  <style>
    :root { color-scheme: dark; }
    .fade { animation: fade .9s ease-out; }
    @keyframes fade { from { opacity: 0; } }
    .val { font-size: 34px; fill: #38bdf8; font-weight: bold; text-anchor: middle; }
    .lbl { font-size: 11px; fill: #e6edf3; text-anchor: middle; letter-spacing: 0.5px; }
    .sub { font-size: 9.5px; fill: #8b949e; text-anchor: middle; letter-spacing: 0.3px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none!important; } }
  </style>

  <!-- Card background matching terminal/header -->
  <rect x="0.5" y="0.5" width="999" height="141" rx="10" fill="#161b22" stroke="#30363d"/>

  <!-- Column 1: Total Contributions -->
  <g class="fade" style="animation-delay: 0s;">
    <text x="125.0" y="62" class="val">191</text>
    <text x="125.0" y="84" class="lbl">contributions</text>
    <text x="125.0" y="100" class="sub">past 12 months</text>
  </g>

  <!-- Dividing line 1 -->
  <line x1="250.0" y1="30" x2="250.0" y2="112" stroke="#30363d" stroke-dasharray="3 3"/>

  <!-- Column 2: Public Repositories -->
  <g class="fade" style="animation-delay: 0.08s;">
    <text x="375.0" y="62" class="val">2</text>
    <text x="375.0" y="84" class="lbl">public repositories</text>
    <text x="375.0" y="100" class="sub">excluding forks</text>
  </g>

  <!-- Dividing line 2 -->
  <line x1="500.0" y1="30" x2="500.0" y2="112" stroke="#30363d" stroke-dasharray="3 3"/>

  <!-- Column 3: Main Language -->
  <g class="fade" style="animation-delay: 0.16s;">
    <text x="625.0" y="62" class="val">Python</text>
    <text x="625.0" y="84" class="lbl">top language</text>
    <text x="625.0" y="100" class="sub">most used in public repos</text>
  </g>

  <!-- Dividing line 3 -->
  <line x1="750.0" y1="30" x2="750.0" y2="112" stroke="#30363d" stroke-dasharray="3 3"/>

  <!-- Column 4: Years on GitHub -->
  <g class="fade" style="animation-delay: 0.24s;">
    <text x="875.0" y="62" class="val">3.0</text>
    <text x="875.0" y="84" class="lbl">years</text>
    <text x="875.0" y="100" class="sub">on GitHub platform</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="Industrial Engineering Student" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace">
  <title>Industrial Engineering Student — Spain</title>
  <defs>
    <!-- Title Gradient (Blue - Cyan - Blue) -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Shimmer Flash -->
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Wave Fill -->
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Background Glow -->
    <radialGradient id="glow" cx="50%" cy="32%" r="62%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Mask with Main Text -->
    <mask id="nameMask">
      <text x="500" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="6" text-anchor="middle" fill="#fff">JAVIER SÁEZ</text>
    </mask>

    <!-- Graphic Curve Path -->
    <path id="curve" d="M64 260 C 180 270, 250 210, 380 230 C 500 250, 620 200, 750 225 C 830 240, 890 220, 936 210"/>
  </defs>

  <style>
    :root { color-scheme: dark; }

    .fade { animation: fade .9s ease-out; }
    @keyframes fade { from { opacity: 0; } }
    .d1 { animation-delay: .1s; }
    .d2 { animation-delay: .22s; }

    /* Self-drawn stroke */
    .draw { stroke-dasharray: 2600; animation: draw 2.2s cubic-bezier(.4,0,.2,1) .2s; }
    @keyframes draw { from { stroke-dashoffset: 2600; } }

    /* Flash animation over the title */
    .shimmer { animation: shimmer 6s ease-in-out 1.2s infinite; }
    @keyframes shimmer { 0%,15% { transform: translateX(0); } 65%,100% { transform: translateX(1120px); } }

    /* Dot path over the wave */
    .cursor {
      offset-path: path("M64 260 C 180 270, 250 210, 380 230 C 500 250, 620 200, 750 225 C 830 240, 890 220, 936 210");
      offset-rotate: 0deg;
      animation: ride 10s linear infinite;
    }
    @keyframes ride {
      0% { offset-distance: 0%; }
      100% { offset-distance: 100%; }
    }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none!important; } }
  </style>

  <!-- Background and Interface -->
  <rect width="1000" height="320" rx="14" fill="#0d1117"/>
  <rect width="1000" height="320" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="319" rx="14" fill="none" stroke="#30363d"/>

  <!-- Top Bar -->
  <g class="fade">
    <line x1="1" y1="40" x2="999" y2="40" stroke="#30363d"/>
    <circle cx="64" cy="24.5" r="3.5" fill="#38bdf8" class="pulse"/>
    <text x="77" y="28.5" font-size="11" fill="#8b949e" letter-spacing="1.6">ENGINEERING &amp; TECHNOLOGY</text>
    <text x="936" y="28.5" font-size="11" fill="#8b949e" text-anchor="end" letter-spacing="1.6">SPAIN</text>
  </g>

  <!-- Main Title and Subtitle -->
  <g class="fade d1">
    <g mask="url(#nameMask)">
      <rect x="100" y="80" width="800" height="62" fill="url(#nameGrad)"/>
      <rect class="shimmer" x="-70" y="80" width="180" height="62" fill="url(#shine)"/>
    </g>
    <text x="500" y="160" font-size="13" fill="#e6edf3" text-anchor="middle" letter-spacing="3.5">INDUSTRIAL ENGINEERING STUDENT · DEVELOPER</text>
  </g>

  <!-- Animated Graph Section -->
  <g class="fade d2">
    <!-- Vertical Guides -->
    <line x1="64" y1="196" x2="64" y2="288" stroke="#0c4a6e" stroke-width="1" opacity="0.4"/>
    <line x1="350" y1="196" x2="350" y2="288" stroke="#0c4a6e" stroke-width="1" opacity="0.4"/>
    <line x1="650" y1="196" x2="650" y2="288" stroke="#0c4a6e" stroke-width="1" opacity="0.4"/>
    <line x1="936" y1="196" x2="936" y2="288" stroke="#0c4a6e" stroke-width="1" opacity="0.4"/>
    <line x1="64" y1="288" x2="936" y2="288" stroke="#30363d"/>

    <!-- Filled Area and Stroke -->
    <path d="M64 260 C 180 270, 250 210, 380 230 C 500 250, 620 200, 750 225 C 830 240, 890 220, 936 210 L936 288 L64 288 Z" fill="url(#areaFill)"/>
    <use href="#curve" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" class="draw"/>

    <!-- Axis Legends -->
    <text x="64" y="304" font-size="9" fill="#6b7280" text-anchor="middle" letter-spacing="1.2">LEARNING</text>
    <text x="350" y="304" font-size="9" fill="#6b7280" text-anchor="middle" letter-spacing="1.2">ANALYSIS</text>
    <text x="650" y="304" font-size="9" fill="#6b7280" text-anchor="middle" letter-spacing="1.2">DEVELOPMENT</text>
    <text x="936" y="304" font-size="9" fill="#6b7280" text-anchor="middle" letter-spacing="1.2">OPTIMIZATION</text>

    <!-- Animated Cursor -->
    <g class="cursor">
      <line x1="0" y1="0" x2="0" y2="-10" stroke="#7dd3fc" stroke-width="1" opacity="0.7"/>
      <circle r="4" fill="#38bdf8"/>
      <circle r="7" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>
    </g>
  </g>
</svg>

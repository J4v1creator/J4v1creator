name: Update Profile Assets

on:
  push:
    branches:
      - main
  schedule:
    # It runs automatically every day at midnight
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate SVGs
        run: |
          python scripts/generate_projects_svg.py
          python scripts/generate_stats_svg.py

      - name: Commit and push updated assets
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "auto: update generated profile assets"
          file_pattern: "assets/*"